const monthThemes={"2026-05":{title:"幸運開獎 × 戀愛宇宙暖身月",goal:"高互動、建立心小跳調性"},"2026-06":{title:"曖昧升溫 × 深夜陪伴月",goal:"提高收藏、轉發與私訊"},"2026-07":{title:"夏日桃花 × 高流量占卜月",goal:"吸新粉、養互動"},"2026-08":{title:"靈魂整理 × 人森觀察月",goal:"強化心小跳人森觀察室 IP"}};

let posts=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")||defaultPosts, selectedMonth=posts[0]?.month||"2026-05", selectedWeek="all";
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(posts))} function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function options(arr,val){return arr.map(x=>`<option ${x===val?"selected":""}>${x}</option>`).join("")}
function render(){const months=[...new Set(posts.map(p=>p.month))].sort(), mf=document.getElementById("monthFilter");mf.innerHTML=months.map(m=>`<option ${m===selectedMonth?"selected":""}>${m}</option>`).join("");const info=monthThemes[selectedMonth]||{title:"自訂內容月",goal:"穩定發文、累積數據"};document.getElementById("monthTitle").innerText=info.title;document.getElementById("monthGoal").innerText=info.goal;const filtered=posts.filter(p=>p.month===selectedMonth).filter(p=>selectedWeek==="all"||String(p.week)===selectedWeek).sort((a,b)=>a.date.localeCompare(b.date));["likes","comments","saves","shares","dms"].forEach(k=>document.getElementById(k).innerText=filtered.reduce((a,p)=>a+Number(p[k]||0),0));document.getElementById("postList").innerHTML=filtered.map(card).join("")}
function card(p){return `<article class="post"><div class="postHead"><div class="mini"><input value="${esc(p.date)}" onchange="update(${p.id},'date',this.value)"><input value="${esc(p.time)}" onchange="update(${p.id},'time',this.value)" style="width:80px"><select onchange="update(${p.id},'day',this.value)">${options(["週一","週二","週三","週四","週五","週六","週日","自訂"],p.day)}</select></div><input class="titleInput" value="${esc(p.title)}" onchange="update(${p.id},'title',this.value)"><div class="mini" style="margin-top:12px"><select onchange="update(${p.id},'platform',this.value)">${options(platforms,p.platform)}</select><select onchange="update(${p.id},'type',this.value)">${options(types,p.type)}</select><select onchange="update(${p.id},'status',this.value)">${options(statuses,p.status)}</select></div></div><div class="postBody"><p class="label">完整文案</p><textarea onchange="update(${p.id},'content',this.value)">${esc(p.content)}</textarea><p class="label">CTA</p><textarea onchange="update(${p.id},'cta',this.value)">${esc(p.cta)}</textarea><p class="label">今天要做什麼</p><textarea onchange="update(${p.id},'task',this.value)">${esc(p.task)}</textarea><p class="label">策略備註</p><textarea onchange="update(${p.id},'note',this.value)">${esc(p.note)}</textarea><div class="metrics">${["likes","comments","saves","shares","dms"].map(k=>`<div class="metric"><span>${k}</span><input type="number" value="${p[k]||0}" onchange="update(${p.id},'${k}',this.value)"></div>`).join("")}</div><div class="actions"><button class="dark" onclick="copyPost(${p.id})">複製文案＋CTA</button><button class="ghost" onclick="delPost(${p.id})">刪除</button></div></div></article>`}
function update(id,key,val){posts=posts.map(p=>p.id===id?{...p,[key]:val}:p);save();render()} function delPost(id){if(confirm("確定刪除這篇？")){posts=posts.filter(p=>p.id!==id);save();render()}} function copyPost(id){const p=posts.find(x=>x.id===id);navigator.clipboard.writeText(`${p.content}\n\n${p.cta}`).then(()=>alert("已複製 ✨"))}
function addPost(){posts.unshift({id:Date.now(),month:selectedMonth,week:1,day:"自訂",date:`${selectedMonth}-01`,time:"20:00",platform:"IG",type:"大眾占卜",title:"新貼文主題",content:"在這裡填完整文案",cta:"留言你的選項。",task:"製作素材並排程。",note:"自訂新增。",status:"草稿",likes:0,comments:0,saves:0,shares:0,dms:0});save();render()} function resetDefault(){if(confirm("恢復預設會清掉你目前修改，確定嗎？")){posts=defaultPosts;selectedMonth="2026-05";selectedWeek="all";save();render()}} function generateNextMonth(){const m=prompt("輸入月份，例如 2026-06");if(!m)return;const base=defaultPosts.map((p,i)=>({...p,id:Date.now()+i,month:m,date:`${m}-${String(i+1).padStart(2,"0")}`,status:"草稿",likes:0,comments:0,saves:0,shares:0,dms:0,note:`由「${p.title}」延伸，可依 ${m} 主題微調。`}));posts=[...posts,...base];selectedMonth=m;save();render()}
document.getElementById("monthFilter").addEventListener("change",e=>{selectedMonth=e.target.value;render()});document.getElementById("weekFilter").addEventListener("change",e=>{selectedWeek=e.target.value;render()});render();
